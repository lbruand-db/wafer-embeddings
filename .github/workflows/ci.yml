name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-26.04 # pinned: ubuntu-latest moves between LTS images on its own
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0 # no floating major tags; bump explicitly
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Install dependencies (public PyPI)
        run: uv sync

      - name: Format check (black)
        run: uv run black --check .

      - name: Type check (ty)
        run: uv run ty check

      - name: Unit tests (pytest)
        run: uv run pytest

      - name: App frontend unit tests (node --test; wafer.js has no npm deps)
        run: node --test app/frontend/src/*.test.js
