resources:
  jobs:
    embed:
      name: wafer-embeddings-embed
      description: >-
        Load the batch embeddings (written to the volume by ai_runtime/embed.yaml with the
        UC encoder @champion) into the Delta table wafer_map_embeddings, change data feed
        on, for the Lakebase synced table. SPECS.md §10.
      tasks:
        - task_key: embed
          python_wheel_task:
            package_name: wafer_embeddings
            entry_point: wafer-embed-load
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - ../dist/*.whl
