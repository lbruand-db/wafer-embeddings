[project]
name = "wafer-embeddings"
version = "0.1.0"
description = "Per-die ViT + DINO embedding model for wafer maps (MixedWM38)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Installed in Databricks jobs / serverless env (pinned per SPECS.md §11.5).
jobs = [
    "mlflow>=3.12",
    "databricks-sdk>=0.102.0",
    "pandas>=2.0",
    "pyarrow>=15",
]
# Exact + ANN search at scale (unit tests use a pure-numpy fallback instead).
search = ["faiss-cpu>=1.8"]

[project.scripts]
# Databricks python_wheel_task entry points (added as modules land).
wafer-bootstrap = "wafer_embeddings.jobs.bootstrap:main"
wafer-ingest = "wafer_embeddings.jobs.ingest:main"
wafer-train = "wafer_embeddings.jobs.train:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyarrow", # exercises the train job's parquet sampling in tests
    "pandas", # pyfunc / register helpers in tests
    "pytest>=8",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wafer_embeddings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ty.environment]
python-version = "3.11"
