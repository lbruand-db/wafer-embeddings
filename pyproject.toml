[project]
name = "wafer-embeddings"
version = "0.1.0"
description = "Per-die ViT + DINO embedding model for wafer maps (MixedWM38)."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "torch>=2.4",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Installed in Databricks jobs / serverless env (pinned per SPECS.md §11.5).
jobs = [
    "mlflow>=3.12",
    "boto3>=1.34,<1.43", # UC model-version storage client on AWS (mlflow[databricks] pulls GCP/Azure too)
    "databricks-sdk>=0.102.0",
    "pandas>=2.0",
    "pyarrow>=15",
]
# Exact + ANN search at scale (unit tests use a pure-numpy fallback instead).
search = ["faiss-cpu>=1.8"]

[project.scripts]
# Databricks python_wheel_task entry points (added as modules land).
wafer-bootstrap = "wafer_embeddings.jobs.bootstrap:main"
wafer-ingest = "wafer_embeddings.jobs.ingest:main"
wafer-train = "wafer_embeddings.jobs.train:main"
wafer-embed-load = "wafer_embeddings.jobs.embed:main_load"
wafer-lakebase = "wafer_embeddings.jobs.lakebase:main"
wafer-serve = "wafer_embeddings.jobs.serve:main"
wafer-register = "wafer_embeddings.jobs.register:main"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pyarrow", # exercises the train job's parquet sampling in tests
    "pandas", # pyfunc / register helpers in tests
    "fastapi", # the Vue app's backend (app/server.py) in tests
    "httpx", # fastapi.testclient
    "pytest>=8",
    "ty>=0.0.84",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wafer_embeddings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["app"] # the Databricks App's modules (server, wafer_search), imported by tests

[tool.ty.src]
# app/node_modules: the Vue build's npm deps (not Python).
exclude = ["app/node_modules"]
