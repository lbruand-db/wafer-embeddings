resources:
  jobs:
    ingest:
      name: wafer-embeddings-ingest
      description: >-
        Download WM-811K, load LSWMD.pkl, and write parsed wafers (variable-size,
        single-label; dedup + leakage-safe splits) to a Delta table (SPECS.md §7).
      tasks:
        - task_key: ingest
          python_wheel_task:
            package_name: wafer_embeddings
            entry_point: wafer-ingest
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--volume"
              - "${var.volume}"
              - "--table"
              - "wafer_maps"
              - "--source-url"
              - "${var.dataset_url}"
              - "--limit"
              - "${var.ingest_limit}"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "${var.serverless_environment_version}"
            dependencies:
              - ../dist/*.whl
              - pandas
              - pyarrow
