bundle:
  name: wafer-embeddings

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog (assumed to pre-exist at metastore level).
    default: mmf_mlops_demo_catalog
  schema:
    description: UC schema; created idempotently by the bootstrap job.
    default: wafer_embeddings
  volume:
    description: UC volume for raw wafer data; created by bootstrap.
    default: raw
  # Pin a modern serverless environment: the default/base env is old
  # (Python 3.10, no mlflow/torch) — see SPECS.md §16 item 17.
  serverless_environment_version:
    default: "3"
  # WM-811K archive URL (zip containing LSWMD.pkl). Downloaded Databricks-side.
  dataset_url:
    default: "http://mirlab.org/dataSet/public/MIR-WM811K.zip"
  # Model Serving endpoint name. The endpoint is managed by jobs/serve.py (it serves
  # whatever version wafer_encoder@champion points to), not declared as a bundle resource:
  # Model Serving needs a concrete version, which a bundle would have to hard-code.
  serving_endpoint:
    default: "wafer-encoder"
  # Workspace directory holding the MLflow experiment `wafer-embeddings`.
  experiment_dir:
    default: /Workspace/Users/lucas.bruand@databricks.com
  # Training command for the pipeline job; ../ai_runtime/commands/train_smoke.sh for a
  # cheap end-to-end check.
  train_command:
    default: ../ai_runtime/commands/train.sh
  # Rows to ingest (0 = all ~811K). Set small for a cheap first validation run.
  ingest_limit:
    default: "0"

artifacts:
  wafer_embeddings_wheel:
    type: whl
    path: .
    build: uv build --wheel
  # Code for the AI Runtime GPU tasks (ai_runtime_task unpacks it as $CODE_SOURCE_PATH).
  code_source:
    type: tgz
    path: .
    include:
      - src
    files:
      - source: ./dist/code_source.tgz

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-mmf-mlops-demo.cloud.databricks.com
