# Databricks AI Runtime serverless-GPU training workload (SPECS.md §4/§7/§11.3).
#
# Launched with:  databricks air run --file ai_runtime/train.yaml --profile mmf
# Validate first: databricks air run --file ai_runtime/train.yaml --dry-run --profile mmf
# Smoke test:     ... --override env_variables.STEPS=50 \
#                     --override env_variables.MAX_TRAIN=2000 \
#                     --override env_variables.EVAL_CAP=1500 \
#                     --override env_variables.BATCH_SIZE=8 \
#                     --override env_variables.DEPTH=4 \
#                     --override env_variables.MAX_TOKENS=1024
#
# Local code is shipped the documented way: code_source.snapshot uploads ./src and
# exposes it to the command via $CODE_SOURCE_PATH (no wheel/volume install).
# AI Runtime is Public Preview; `databricks air` is "under active development".

experiment_name: wafer-embeddings
mlflow_experiment_directory: /Workspace/Users/lucas.bruand@databricks.com
mlflow_run_name: dino-g1

compute:
  accelerator_type: GPU_1xA10
  num_accelerators: 1

# Fail fast during development — no silent retries hiding/delaying errors.
max_retries: 0

environment:
  version: "6" # env v6 ships numpy but NOT torch — code_source doesn't install our
               # package deps, so declare everything the job imports explicitly.
  dependencies:
    - torch # CUDA build from PyPI; uses the A10 at runtime
    - scikit-learn
    - mlflow
    - pandas
    - pyarrow

# Upload src/ (top-level = the wafer_embeddings package) and import it via PYTHONPATH.
code_source:
  type: snapshot
    # root_path is relative to THIS YAML file (ai_runtime/), so ../src = repo-root/src.
  snapshot:
    root_path: ../src
    remote_volume: /Volumes/mmf_mlops_demo_catalog/wafer_embeddings/raw

# Overridable knobs (see --override above); the numeric defaults mirror the argparse
# defaults in jobs/train.py (full Gate-G1 run). Keep the two in sync when changing them.
env_variables:
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True # reduce CUDA fragmentation
  MAX_TRAIN: "50000"
  EVAL_CAP: "20000"
  STEPS: "2000"
  BATCH_SIZE: "64"
  DEPTH: "12"
  MAX_TOKENS: "4096"
  # ISAB (O(N*m)) is the default: WM-811K has large variable-size maps for which
  # full O(N^2) attention OOMs an A10 (SPECS.md §4 / de-risking R3).
  ATTENTION: "isab"

command: |
  PYTHONPATH="$CODE_SOURCE_PATH" python -m wafer_embeddings.jobs.train \
    --catalog mmf_mlops_demo_catalog --schema wafer_embeddings \
    --max-train "$MAX_TRAIN" --eval-cap "$EVAL_CAP" --steps "$STEPS" \
    --batch-size "$BATCH_SIZE" --attention "$ATTENTION" \
    --depth "$DEPTH" --max-tokens "$MAX_TOKENS"
