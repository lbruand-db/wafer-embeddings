resources:
  apps:
    wafer_search:
      name: wafer-search
      description: Wafer-map similarity search over Lakebase Search (lakebase_ann) + the wafer-encoder endpoint.
      source_code_path: ../app
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${resources.model_serving_endpoints.wafer_encoder.name}
            permission: CAN_QUERY
        - name: postgres
          postgres:
            branch: projects/wafer-embeddings/branches/production
            database: projects/wafer-embeddings/branches/production/databases/wafer-embeddings
            permission: CAN_CONNECT_AND_CREATE
